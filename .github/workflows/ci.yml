name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Swift Package
    runs-on: macos-latest
    env:
      BETTER_AUTH_CONTRACT_BASE_URL: ${{ secrets.BETTER_AUTH_CONTRACT_BASE_URL }}
      BETTER_AUTH_CONTRACT_EMAIL: ${{ secrets.BETTER_AUTH_CONTRACT_EMAIL }}
      BETTER_AUTH_CONTRACT_PASSWORD: ${{ secrets.BETTER_AUTH_CONTRACT_PASSWORD }}
      BETTER_AUTH_CONTRACT_USERNAME: ${{ secrets.BETTER_AUTH_CONTRACT_USERNAME }}
      BETTER_AUTH_CONTRACT_USERNAME_PASSWORD: ${{ secrets.BETTER_AUTH_CONTRACT_USERNAME_PASSWORD }}
      BETTER_AUTH_CONTRACT_EXPECT_JWKS: ${{ secrets.BETTER_AUTH_CONTRACT_EXPECT_JWKS }}
      BETTER_AUTH_CONTRACT_SUPPORTS_ANONYMOUS: ${{ secrets.BETTER_AUTH_CONTRACT_SUPPORTS_ANONYMOUS }}
      BETTER_AUTH_CONTRACT_PROVISION_WITH_FIXTURES: ${{ secrets.BETTER_AUTH_CONTRACT_PROVISION_WITH_FIXTURES }}
      BETTER_AUTH_CONTRACT_FIXTURE_CAPTURE_URL: ${{ secrets.BETTER_AUTH_CONTRACT_FIXTURE_CAPTURE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/cf-workers-uikit/worker/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install release tools
        run: brew install swiftformat swiftlint

      - name: Install worker dependencies
        run: |
          bun install --cwd examples/cf-workers-swiftui --frozen-lockfile
          bun install --cwd examples/cf-workers-swiftui/worker --frozen-lockfile
          npm ci --prefix examples/cf-workers-uikit/worker

      - name: Typecheck example workers
        run: |
          bun run --cwd examples/cf-workers-swiftui/worker typecheck
          npm --prefix examples/cf-workers-uikit/worker run typecheck

      - name: Run release verifier
        run: Scripts/verify_release.sh

      - name: Run local live contracts
        run: Scripts/run_local_contracts.sh
